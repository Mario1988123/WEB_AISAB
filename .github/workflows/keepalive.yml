name: Mantener Supabase despierto

# Supabase (plan Free) pausa el proyecto tras 7 dias sin actividad.
# Este cron hace una consulta real a la base los lunes y jueves,
# asi que nunca se llega a los 7 dias.
#
# La clave de abajo es la ANON KEY: es publica por diseño y ya esta
# en js/config.js (la usa el navegador de cualquier visitante).
# No es la service_role key — esa NUNCA debe salir del panel.

on:
  schedule:
    - cron: '17 7 * * 1,4'   # lunes y jueves, 07:17 UTC
  workflow_dispatch:          # permite lanzarlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar Supabase para marcar actividad
        env:
          SUPABASE_URL: https://bgurifqwanvrhgmpteiq.supabase.co
          SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndXJpZnF3YW52cmhnbXB0ZWlxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5NTI5ODksImV4cCI6MjA5OTUyODk4OX0.WGyl7qwKzROf98Mll_7EvpbUoxbXe8kyhS6xwdbt1R4
        run: |
          # Pide solo la columna `id` y una fila. RLS impide que `anon` lea
          # nada, asi que la respuesta es siempre []. Pero PostgREST ejecuta
          # un SELECT real contra Postgres, y eso es lo que cuenta como
          # actividad para que Supabase no pause el proyecto.
          #
          # Nunca imprimimos el cuerpo de la respuesta: si algun dia se
          # añadiera una politica de SELECT para `anon`, los datos de las
          # sugerencias acabarian en los logs publicos de Actions.
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/sugerencias?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP $codigo"

          if [ "$codigo" != "200" ]; then
            echo "::error::Supabase no respondio correctamente (HTTP $codigo). Comprueba en el panel si el proyecto esta pausado."
            exit 1
          fi

          echo "Supabase respondio correctamente. Proyecto activo."
